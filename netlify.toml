# Netlify build + routing config for the SIP Scavenger Hunt tracker.
# Functions use v2 syntax and declare their own paths (/api/*), so the only
# redirect we need is the SPA fallback so client routes like /admin work.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# These two are PUBLIC by design (the Supabase project URL + anon/publishable
# key are embedded in the browser bundle and protected by row-level security).
# Tell Netlify's secret scanner not to flag them, so the build doesn't fail when
# it finds them in the published output. The genuinely secret values
# (SUPABASE_SERVICE_ROLE_KEY, ADMIN_PASSWORD) are NOT omitted and stay scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# SPA fallback: serve index.html for any non-API route so React Router-style
# client routing (/admin, /join, ...) survives a hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
